<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Team Login — AWS Field Presales Command Centre</title>
  <link rel="stylesheet" href="/css/style.css">
  <style>
    body {
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle at top right, #E9F5EC 0%, #F9FCF7 60%, #DDF0E4 100%) fixed;
    }
    .login-container {
      width: 100%;
      max-width: 440px;
      padding: 24px;
    }
    .login-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px 36px;
      box-shadow: var(--shadow-lg);
    }
    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .brand-logo {
      height: 48px;
      width: auto;
      margin: 0 auto 16px;
      display: block;
    }
    .portal-tagline {
      font-size: 11px;
      font-weight: 700;
      color: var(--green-600);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 4px;
    }
    .portal-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--green-900);
      letter-spacing: 0.02em;
      line-height: 1.25;
      text-transform: uppercase;
    }
    .login-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 6px;
    }
  </style>
</head>
<body>

<div class="login-container">
  <div class="login-card">
    <div class="brand-header">
      <img src="/assets/redington-logo.png" alt="Redington" class="brand-logo">
      <div class="portal-tagline">AWS Field Presales Team</div>
      <h1 class="portal-title">Command Centre</h1>
      <p class="login-sub">Internal authentication gateway & intelligence hub</p>
    </div>

    <div id="loginAlert" class="alert alert-danger" style="display:none;"></div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username" class="form-label">Username or Corporate Email</label>
        <input type="text" id="username" class="form-control" placeholder="e.g. jdoe or john@redington.com" required autofocus autocomplete="username">
      </div>

      <div class="form-group">
        <label for="password" class="form-label">Password</label>
        <input type="password" id="password" class="form-control" placeholder="••••••••••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
        Sign In to Command Centre
      </button>
    </form>
  </div>
</div>

<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const alertBox = document.getElementById('loginAlert');
  const btn = document.getElementById('loginBtn');
  alertBox.style.display = 'none';

  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;

  if (!username || !password) return;

  btn.disabled = true;
  btn.textContent = 'Authenticating...';

  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    const data = await res.json();

    if (!res.ok || !data.ok) {
      alertBox.textContent = data.error || 'Authentication failed. Please verify credentials.';
      alertBox.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign In to Command Centre';
      return;
    }

    // Handle mandatory first-login password change
    if (data.mustChangePassword) {
      window.location.href = '/profile?must_change=1';
      return;
    }

    // Check redirect parameter in URL
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUrl = urlParams.get('redirect') || '/';
    window.location.href = redirectUrl;

  } catch (err) {
    alertBox.textContent = 'Network or server communication error. Please try again.';
    alertBox.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Sign In to Command Centre';
  }
});
</script>

</body>
</html>
